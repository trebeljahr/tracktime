<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="tracktime docs">
  <!-- Source of truth for social-card.png, which is what Docusaurus links:
       crawlers do not render SVG. Regenerate the PNG with `pnpm run
       icons:brand` after editing this file.

       Self-contained on purpose — no external fonts, no <image> href. A
       rasterizer resolves neither, and the card would ship with holes in it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090B"/>
      <stop offset=".62" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1072" cy="112" r="188" fill="#4F46E5" opacity=".22"/>
  <circle cx="96" cy="566" r="216" fill="#818CF8" opacity=".14"/>

  <!-- Mark, at the lockup's proportions: 96px tile, wordmark baseline centred on it. -->
  <g transform="translate(76 68)">
    <rect width="96" height="96" rx="21" fill="#4F46E5"/>
    <g transform="translate(48 48) scale(1.5) translate(-32 -32)">
      <circle cx="32" cy="32" r="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"/>
      <path d="M32 13A19 19 0 1 1 15.55 41.5" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
    </g>
    <text x="124" y="64" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="52" font-weight="700" letter-spacing="-1.4">
      <tspan fill="#FAFAFA">track</tspan><tspan fill="#A5B4FC">time</tspan><tspan dx="18" fill="#71717A">docs</tspan>
    </text>
  </g>

  <text x="76" y="330" fill="#FAFAFA" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Time tracking, and</text>
  <text x="76" y="416" fill="#FAFAFA" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">reporting that answers.</text>

  <text x="78" y="492" fill="rgba(250,250,250,.72)" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30">Web app, browser extension, Raycast, desktop and mobile —</text>
  <text x="78" y="536" fill="rgba(250,250,250,.72)" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30">one timer, one account, offline-tolerant sync.</text>
</svg>
