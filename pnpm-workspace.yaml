packages:
  - "packages/*"
  - "docs-site"
allowBuilds:
  '@sentry/cli': true
  core-js: true
  core-js-pure: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# @raycast/api hard-depends on @types/react 19.0.10, so a second copy of the
# React types lands in the virtual store alongside the client's 19.2.14. pnpm
# then hoists ONE of them into node_modules/.pnpm/node_modules, and which one
# wins varies between installs. Next's own bundled .d.ts files resolve `react`
# from that hoisted directory, so when 19.0.10 wins they drag it into the
# client's type program next to 19.2.14 and every ReactNode becomes two
# incompatible types (TS2322 in components/ui/command.tsx). Forcing a single
# version keeps the hoist deterministic.
overrides:
  "@types/react": "^19.2.14"
