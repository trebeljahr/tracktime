name: Bug report
description: Something in tracktime does not behave the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Before filing, please search the existing issues — someone may have hit
        this already.

        **Do not report security problems here.** Email
        ricotrebeljahr@gmail.com instead.

        The more precisely you can describe what you did and what happened, the
        faster this gets fixed. Screenshots and exact timestamps help.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour you observed.
      placeholder: |
        I stopped a running timer from the Raycast menu bar and the entry was
        saved with an end time about a minute earlier than when I clicked.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the behaviour you expected instead.
      placeholder: The entry should end at the moment I stopped it.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >-
        Numbered steps, starting from a known state. If it only reproduces
        sometimes, say how often.
      placeholder: |
        1. Sign in to the web app at http://localhost:3392
        2. Start a timer on any project
        3. Wait two minutes
        4. Open the Raycast menu bar item and choose "Stop timer"
        5. Reload the web app — the entry ends at the wrong time
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which client surface?
      description: Where you saw the problem. Pick the closest match.
      options:
        - Web app
        - Browser extension (Chrome)
        - Raycast extension (macOS)
        - Desktop (Electron)
        - Mobile (Capacitor)
        - Server / API
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >-
        The commit SHA you are running, or the release tag. If you are using the
        hosted app and do not know, write "hosted".
      placeholder: 5542aef, v0.1.0, or "hosted"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Hosted or self-hosted?
      options:
        - Hosted (tracktime.trebeljahr.com)
        - Self-hosted
        - Local development checkout
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Operating system and version, browser and version, Node and pnpm
        versions if you are running it locally. Paste any relevant errors from
        the browser console or the server log.
      placeholder: |
        macOS 15.3, Chrome 141
        Node 24.4.0, pnpm 11.1.2
        Server log: TRPCError: NOT_FOUND at entries.stop
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >-
        Screenshots, a recording, related issues, or anything else that gives
        context.
    validations:
      required: false

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      options:
        - label: >-
            I agree to follow this project's
            [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md).
          required: true
