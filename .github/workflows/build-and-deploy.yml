name: build-and-deploy

on:
  push:
    branches: [main]
  # Pull requests reach `dco`, `verify` and `e2e` — the jobs that only read
  # the checkout and run the test suites. They must NEVER reach build-server,
  # build-client or deploy: this file pushes :main image tags to ghcr.io and
  # POSTs to the Coolify deploy API, and neither is a thing a PR gets to do.
  #
  # That boundary is enforced per job, not by the `needs:` chain. build-server,
  # build-client and deploy each carry their own
  # `if: github.event_name == 'push'` IN ADDITION to their `needs:`, so the two
  # upstream jobs running on a PR cannot pull them in. Do not remove those
  # three `if:` lines, and do not add a job that depends on verify/e2e without
  # deciding explicitly which events it runs on.
  pull_request:
    types: [opened, synchronize, reopened]

# The group was the constant `main-deploy`, which with cancel-in-progress
# would have let PR runs cancel a main deploy mid-flight (and each other).
# Including the event name and ref keeps every push to main in one
# self-cancelling deploy group exactly as before — github.ref is always
# refs/heads/main there — while each PR gets its own group, so a new push
# to a PR branch cancels only that PR's own stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Runs on BOTH events: a contributor has to be able to see that their change
  # builds and passes the tests, which is the whole point of opening a PR.
  # Nothing here reads a secret or writes anywhere — see the `permissions:`
  # block below — so it is equally safe from a fork.
  verify:
    runs-on: ubuntu-latest
    # The workflow-level block grants `packages: write` for the two image
    # pushes. This job pins `contents: read` instead, so PR code never runs
    # with a token that can publish a package. (A fork PR gets a read-only
    # token regardless; this covers same-repo branch PRs too.)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # `pnpm run build` compiles shared -> core -> server -> client, which
      # leaves packages/extension, packages/raycast and electron/ untypechecked
      # — they are not in the build graph at all. A change that breaks the
      # browser extension, the Raycast extension or the Electron main process
      # would otherwise go green through the entire pipeline.
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:unit
      - run: pnpm run test:client

  # Also runs on both events. Every credential it needs is a literal in the
  # `env:` block below (throwaway values for containers that live for the
  # length of the job), so it works unchanged from a fork.
  #
  # It is the slow job — 42 specs, `workers: 1`, plus a client build. If that
  # turns out to be too slow to sit on every push to a draft branch, gate it
  # with `if: github.event_name == 'push' || !github.event.pull_request.draft`
  # and add `ready_for_review` to the pull_request `types:` above, rather than
  # dropping it from PRs entirely.
  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
    services:
      mongo-e2e:
        image: mongo:7
        ports:
          - 27018:27017
        # start-server.sh's own Mongo readiness loop is inside an
        # `if [ -z "${CI:-}" ]` guard, so under CI nothing waits for Mongo —
        # without this the server can start before the database accepts
        # connections, which surfaces as an unexplained failure on somebody's
        # first contribution.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Start MinIO
        run: |
          docker run -d --name e2e-minio -p 9002:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            --tmpfs /data minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9002/minio/health/live && break
            sleep 1
          done
          # Both bucket names: the job env below sets S3_BUCKET_NAME to
          # starter-e2e, but playwright.config.ts's server webServer `env:`
          # block hardcodes tracktime-e2e and overrides it — so the bucket the
          # server actually writes to is tracktime-e2e.
          docker run --rm --network host \
            --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://127.0.0.1:9002 minioadmin minioadmin && \
             mc mb --ignore-existing local/starter-e2e && \
             mc anonymous set download local/starter-e2e && \
             mc mb --ignore-existing local/tracktime-e2e && \
             mc anonymous set download local/tracktime-e2e"

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/starter-e2e
          REDIS_URL: redis://127.0.0.1:6380
          BETTER_AUTH_SECRET: e2e-test-secret
          BETTER_AUTH_URL: http://127.0.0.1:5006
          FRONTEND_URL: http://127.0.0.1:3001
          S3_ENDPOINT: http://127.0.0.1:9002
          S3_FORCE_PATH_STYLE: "true"
          S3_BUCKET_NAME: starter-e2e
          S3_PUBLIC_URL: http://127.0.0.1:9002/starter-e2e
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1

  # PUSH ONLY. `docker/login-action` below authenticates to ghcr.io with
  # secrets.GITHUB_TOKEN, which is read-only on a fork PR — `push: true` would
  # fail with a 403. The `if:` is what keeps this job off pull requests; the
  # `needs:` does not, since verify and e2e now run on both events.
  build-server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-server:main
            ghcr.io/${{ github.repository }}-server:${{ github.sha }}

  # PUSH ONLY, for the same reason as build-server. Keep the `if:`.
  build-client:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          # NEXT_PUBLIC_* are inlined into the browser bundle at image
          # BUILD time — setting them as runtime env on the deployed
          # container does nothing.
          #
          # NEXT_PUBLIC_API_URL is the API's ORIGIN, not a base path: the
          # client appends `/api/trpc` and `/api/auth` itself, and
          # `resolveSyncUrl` appends `/api/ws`. The server still mounts every
          # route at `/api`, so the real tRPC endpoint is
          # `https://api.trackyourtime.dev/api/trpc` — the doubled-looking
          # segment is deliberate, not a stray path in this value.
          #
          # The API is a SEPARATE ORIGIN from the web app, so the browser
          # client is cross-origin: FRONTEND_URL / TRUSTED_ORIGINS on the
          # server are what make sign-in and cookies work, not decoration.
          #
          # Literal rather than only `vars.*`: these were repo VARIABLES with
          # nothing set, so every client image was being built with an empty
          # API URL. A repo variable still wins when set, for a staging or
          # preview host. The analytics values are optional GitHub Actions
          # repo VARIABLES (not secrets):
          #   gh variable set NEXT_PUBLIC_OPENPANEL_CLIENT_ID ...
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackyourtime.dev' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://api.trackyourtime.dev' }}
            NEXT_PUBLIC_OPENPANEL_CLIENT_ID=${{ vars.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL=${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          tags: |
            ghcr.io/${{ github.repository }}-client:main
            ghcr.io/${{ github.repository }}-client:${{ github.sha }}

  # Deploy job — the topology is TWO Coolify apps on TWO hosts of one zone:
  # the client on trackyourtime.dev and the server on api.trackyourtime.dev.
  # Each app owns its own host, so neither has to share a routing rule with
  # the other. Each UUID is optional
  # and skipped when its secret is unset, so a project still on the
  # single-app layout keeps working by setting only COOLIFY_RESOURCE_UUID.
  #
  # Deploying them separately is the point of the split: the server holds
  # the WebSocket sync connections, and a client-only change must not
  # restart it and drop every connected device's socket.
  #
  # PUSH ONLY, and the `if:` below is the only thing enforcing that. Note that
  # the per-step `if: env.COOLIFY_* != ''` guards are NOT a PR safety net: on a
  # fork every COOLIFY_* secret resolves to an empty string, so every step
  # would skip and the job would report GREEN having deployed nothing — a
  # silent false pass, which is worse than a loud failure.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    steps:
      - name: Deploy server app via Coolify API
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        if: env.COOLIFY_BASE_URL != '' && env.COOLIFY_SERVER_RESOURCE_UUID != ''
        run: |
          curl -fsSL -X POST \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_SERVER_RESOURCE_UUID&force=true" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"

      - name: Deploy client app via Coolify API
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_CLIENT_RESOURCE_UUID: ${{ secrets.COOLIFY_CLIENT_RESOURCE_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        if: env.COOLIFY_BASE_URL != '' && env.COOLIFY_CLIENT_RESOURCE_UUID != ''
        run: |
          curl -fsSL -X POST \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_CLIENT_RESOURCE_UUID&force=true" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"

      # Single-app fallback, for a project that has not been split.
      - name: Deploy single app via Coolify API
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_CLIENT_RESOURCE_UUID: ${{ secrets.COOLIFY_CLIENT_RESOURCE_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        if: >-
          env.COOLIFY_BASE_URL != '' && env.COOLIFY_RESOURCE_UUID != ''
          && env.COOLIFY_SERVER_RESOURCE_UUID == ''
          && env.COOLIFY_CLIENT_RESOURCE_UUID == ''
        run: |
          curl -fsSL -X POST \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_RESOURCE_UUID&force=true" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"

      - name: Deploy via webhook (fallback)
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        if: env.COOLIFY_BASE_URL == '' && env.COOLIFY_WEBHOOK_URL != ''
        run: curl -fsSL "$COOLIFY_WEBHOOK_URL"

  # DCO gate — pull requests only. tracktime takes Developer Certificate of
  # Origin 1.1 sign-off rather than a CLA, so the check is mechanical: every
  # non-merge commit in the PR carries a `Signed-off-by:` trailer.
  # Hand-rolled bash on purpose — no third-party action in the trust path of a
  # job that runs against untrusted PR code.
  #
  # The workflow-level block grants `packages: write` for the image pushes, so
  # this job pins its own `contents: read` rather than inheriting that scope —
  # as verify and e2e now do too. No job a pull request can reach writes
  # anything. The pull_request event (rather than pull_request_target) also
  # gives a read-only token for fork PRs.
  dco:
    name: Signed-off-by present on every commit
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required — the default shallow checkout cannot walk
      # base..head. The default pull_request ref is the merge commit, whose
      # two parents ARE base.sha and head.sha, so both ends of the range are
      # already present without a second fetch, forks included.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "Fetching missing commit $sha"
              git fetch --no-tags --quiet origin "$sha" || true
            fi
          done

          # --no-merges so a branch that has main merged into it is judged on
          # its own commits; nobody signs off a merge they did not author.
          commits="$(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")"

          if [ -z "$commits" ]; then
            echo "No non-merge commits between $BASE_SHA and $HEAD_SHA - nothing to check."
            exit 0
          fi

          total=0
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            total=$((total + 1))
            subject="$(git show -s --format='%s' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # %(trailers:...) is git's own trailer parser: it reads only the
            # trailer block at the end of the message, so the words
            # "Signed-off-by" appearing in prose in the body do not count.
            trailers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"

            if [ -z "$(printf '%s' "$trailers" | tr -d '[:space:]')" ]; then
              echo "MISSING  ${sha:0:12}  ${subject}"
              echo "         author: ${author}"
              missing=$((missing + 1))
            elif printf '%s\n' "$trailers" | grep -qxF "$author"; then
              echo "ok       ${sha:0:12}  ${subject}"
            else
              # Not fatal: a sign-off under a second identity (a work address,
              # GitHub's noreply form) is still a sign-off. Surfaced only so a
              # genuine typo is visible in the log.
              echo "ok       ${sha:0:12}  ${subject}"
              echo "         note: signed off as $(printf '%s' "$trailers" | paste -sd ';' -), author is ${author}"
            fi
          done <<< "$commits"

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "--------------------------------------------------------------"
            echo "DCO check failed: $missing of $total commit(s) have no Signed-off-by trailer."
            echo ""
            echo "Contributions to tracktime are accepted under the Developer"
            echo "Certificate of Origin 1.1 (see CONTRIBUTING.md). Every commit"
            echo "must carry a Signed-off-by trailer certifying that you have the"
            echo "right to submit it under the project's license."
            echo ""
            echo "Sign new commits as you make them:"
            echo ""
            echo "    git commit -s -m \"your message\""
            echo ""
            echo "Add the trailer to the commits already on this branch, then"
            echo "update the pull request branch:"
            echo ""
            echo "    git rebase --signoff origin/main"
            echo "    git push --force-with-lease"
            echo ""
            echo "To sign off automatically from now on:"
            echo ""
            echo "    git config --global format.signOff true"
            echo "--------------------------------------------------------------"
            exit 1
          fi

          echo "All $total commit(s) signed off."
