# Production compose for the SERVER Coolify app, routed at
# https://api.trackyourtime.dev — its own host, not a path of the client's.
#
# It used to be a path (<domain>/api) because api.tracktime.trebeljahr.com is
# two labels under trebeljahr.com and the zone's wildcard certificate covers
# only one, so that host had no TLS at all. The path split then failed for a
# different reason: this Coolify instance proxies with caddy-docker-proxy, not
# Traefik, and both apps wrote the same caddy_0 site label — /* won, and
# <domain>/api/health was answered by the client's 404 page. Moving to an apex
# zone gives the API a single-label host the wildcard does cover, and each app
# a caddy site of its own. See docs/deploy.md.
#
# One service, named `server` — the name is load-bearing. Coolify routes a
# dockercompose app through `docker_compose_domains`, which is keyed by
# service name, and `hatchkit sync` writes the key `server` for the split
# topology. A name that isn't in this file makes Coolify accept the PATCH,
# emit no proxy labels, and serve 503 for everything. (Coolify writes
# traefik.* labels too; this instance runs caddy-docker-proxy, so the caddy_*
# ones are the ones that route. Either way the key is the service name.)
#
# Mongo and Redis are NOT here. Under the split they are Coolify-managed
# databases shared with nothing else, reached over the Coolify network via
# MONGODB_URI / REDIS_URL — so a client-only deploy cannot restart the
# database, and a server restart cannot drop the volume.
#
# Do NOT expose ports here — Coolify's reverse proxy handles external routing.

services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/trebeljahr/tracktime-server:main}
    environment:
      PORT: "5159"
      # How many proxies sit in front of this container, which is what
      # Express counts back from the right of X-Forwarded-For to get req.ip.
      # Two here — Cloudflare, then Coolify's reverse proxy. It has to be
      # named in this file to reach the container at all: Coolify's env
      # fields are only interpolation variables for the compose file, so a
      # value set there for a variable nothing references goes nowhere.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      # Supplied by Coolify from the managed database resources.
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # The API's OWN origin — https://api.trackyourtime.dev, not the web
      # app's. better-auth mounts itself at /api/auth of this host and signs
      # cookies for it, so a value pointing at the client's host breaks
      # sign-in. NOT the same value as FRONTEND_URL any more.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # The web app's origin — https://trackyourtime.dev — and the CORS
      # allow-list entry. The browser client is CROSS-origin again now that
      # the API has its own host, so every call is preflighted and the
      # session cookie is cross-site: this value is load-bearing, not a
      # formality. So is TRUSTED_ORIGINS below.
      FRONTEND_URL: ${FRONTEND_URL}
      # Extra origins allowed to sign in — the browser extension's
      # chrome-extension://<id> lives here. Without it better-auth answers
      # sign-in with 403 INVALID_ORIGIN before checking the password.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LISTMONK_URL: ${LISTMONK_URL:-}
      LISTMONK_API_USER: ${LISTMONK_API_USER:-}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN:-}
      LISTMONK_FROM_EMAIL: ${LISTMONK_FROM_EMAIL:-}
      LISTMONK_FROM: ${LISTMONK_FROM:-}
      LISTMONK_LIVE_LIST_ID: ${LISTMONK_LIVE_LIST_ID:-}
      LISTMONK_TEST_LIST_ID: ${LISTMONK_TEST_LIST_ID:-}
      LISTMONK_TX_TEMPLATE_ID: ${LISTMONK_TX_TEMPLATE_ID:-}
      LISTMONK_CAMPAIGN_TEMPLATE_ID: ${LISTMONK_CAMPAIGN_TEMPLATE_ID:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-assets}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${DOTENV_PRIVATE_KEY_PRODUCTION}
    restart: unless-stopped
