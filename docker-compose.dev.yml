# Shared local development infrastructure.
#
# One set of containers serves every checkout of this project — scripts/dev.mjs
# gives each instance its own MongoDB *database*, so worktrees never share data
# even though they share the server.
#
# The published host ports are configurable because other projects on this
# machine may already hold the defaults. Override them in your shell or in a
# .env file next to this compose file:
#
#   MONGO_PORT=27018 REDIS_PORT=6380 S3_PORT=9002 pnpm run dev:infra
#
# and point the app at the same values with MONGO_HOST / MONGO_PORT.

services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - "${S3_PORT:-9000}:8333"
    environment:
      # Omitting AWS creds keeps SeaweedFS in development allow-all mode.
      # The app still sends its local dev credentials from .env.development.
      S3_BUCKET: tracktime-dev
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  seaweedfs-data:
