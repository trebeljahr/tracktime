# One-command self-host stack: `docker compose -f docker-compose.selfhost.yml up -d`
#
#   cp .env.selfhost.example .env          # then edit APP_DOMAIN + BETTER_AUTH_SECRET
#   docker compose -f docker-compose.selfhost.yml up -d
#
# ── Topology ─────────────────────────────────────────────────────────────
#
#   internet ──▶ caddy :80 :443 ──┬──▶ server :5159   /api/*  and  /ws
#                                 └──▶ client :8080   everything else
#                        server ──┬──▶ mongo  :27017
#                                 └──▶ redis  :6379
#
# ONE domain. Caddy terminates TLS for $APP_DOMAIN and is the only container
# with published ports; mongo, redis, server and client are reachable only on
# the compose network. Routing rules live in ./Caddyfile.
#
# ── Why one domain instead of a baked-in API URL ─────────────────────────
#
# Next.js inlines NEXT_PUBLIC_* into the browser bundle when the image is
# BUILT, so a client image that knows an API URL is bound to that host
# forever. Baking one would mean every self-hoster building their own client
# image before they could sign in once. Built EMPTY instead, the bundle calls
# relative URLs — /api/trpc, window.location.origin for better-auth,
# wss://<host>/ws for the sync socket — so one published image works behind
# anybody's domain and the proxy in front is what makes them the same origin.
# It costs one DNS record instead of two, one certificate instead of two, and
# it removes the cross-origin cookie and CORS surface entirely.
#
# The app must therefore be served at the ROOT of the domain. Hosting it under
# https://host/tracktime/ breaks the sync socket, which is derived from
# window.location.origin and would still resolve to wss://host/ws.
#
# ── This is NOT the owner's production deploy ────────────────────────────
#
# That one is the two-app Coolify split in docker-compose.server.yml and
# docker-compose.client.yml (see docs/deploy.md), where the web app and the
# API are on genuinely different hosts and Traefik does the routing. Those
# files are untouched by this one; nothing here interacts with them.

name: tracktime

services:
  # ── Reverse proxy + TLS ────────────────────────────────────────────────
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    # The only published ports in the stack. 80 is not optional: the ACME
    # HTTP challenge is answered on it, and it serves the redirect to HTTPS.
    # 443/udp is HTTP/3.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Read by ./Caddyfile as {$APP_DOMAIN} — the site address, so it also
      # decides which certificate is requested.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env, e.g. track.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account keys. Losing this volume means
      # re-issuing on next start, which counts against the CA's rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    healthcheck:
      # Caddy's admin API, on loopback inside the container only. A request to
      # :80 would not do: the site block matches $APP_DOMAIN, so a probe with
      # any other Host header is answered with a 404 by design.
      #
      # A GET, not `wget --spider`: --spider sends HEAD, and the admin API
      # dispatches /config/ on the method and answers anything outside
      # GET/POST/PUT/PATCH/DELETE with 405 — which would mark a proxy that is
      # routing traffic perfectly well as unhealthy forever.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── API, WebSocket sync, everything stateful ───────────────────────────
  #
  # Exactly ONE replica, deliberately. WebSocket fan-out is in-process (the
  # RoomManager in src/ws/), with no pub/sub bridging instances — a second
  # replica would not error, it would silently deliver live updates to only
  # the half of a user's devices that happened to land on the same process.
  server:
    image: ghcr.io/trebeljahr/tracktime-server:${TRACKTIME_VERSION:-v0.1.0}
    # `image:` and `build:` together, deliberately. With both present Compose
    # takes the published image when there is one and falls back to building
    # from this checkout when there is not, so `up -d` works before a release
    # tag exists as well as after. Force either half with
    # `docker compose ... pull` or `docker compose ... build`.
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    # No `ports:` — the proxy reaches it over the compose network.
    expose:
      - "5159"
    environment:
      NODE_ENV: production
      PORT: "5159"

      # ── Required ─────────────────────────────────────────────────────
      # One URL for the whole deployment. The server derives both the origin
      # it authenticates against (BETTER_AUTH_URL) and the origin it trusts
      # for CORS and WebSocket upgrades (FRONTEND_URL) from it. It must be
      # spelled EXACTLY as people type it in the browser: in production the
      # origin comparison is a literal match, so http://localhost and
      # http://127.0.0.1 are two different deployments as far as the session
      # cookie and the origin check are concerned.
      APP_URL: ${APP_URL:-https://${APP_DOMAIN}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env — openssl rand -base64 32}

      # ── Data stores ──────────────────────────────────────────────────
      # Override either to point at a managed database instead; the local
      # mongo/redis services then simply go unused (comment them out below
      # along with the depends_on entries).
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/tracktime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Extra origins allowed to sign in, comma-separated. Empty is right for
      # a browser-only self-host — the web app's own origin is already
      # trusted via APP_URL. Add the browser extension's chrome-extension://
      # id here if you build one, or capacitor://localhost for a mobile shell.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}

      # ── Email (optional) ─────────────────────────────────────────────
      # With SMTP_HOST empty nothing is sent and password-reset links are
      # printed to the server log instead — `docker compose -f
      # docker-compose.selfhost.yml logs server` is then how you get back in.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      # ── Everything below is optional and off when empty ──────────────
      # The app is feature-complete without any of them: sign-in, tracking,
      # reports, invoices, import and export all work with this block unset.
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # No DOTENV_PRIVATE_KEY_* of any kind. The published image carries no
      # encrypted .env file, so the encrypted-env tooling never activates and
      # every value above is read as a plain environment variable.
    depends_on:
      mongo:
        condition: service_healthy
      # Boot awaits the Redis connection when REDIS_URL is set, and an
      # unreachable Redis is a failed start rather than a degraded one.
      redis:
        condition: service_healthy
    healthcheck:
      # The same probe the image's own HEALTHCHECK uses. `db` in the response
      # reports the Mongo connection, but a 200 is enough to gate the proxy.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'5159')+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── The web app: a static export behind the proxy ──────────────────────
  #
  # A DIFFERENT image from the ghcr `-client` one the owner deploys: this is
  # the build with an empty NEXT_PUBLIC_API_URL, published under its own
  # package name so the two can never be confused at `docker pull` time.
  # Pulling `-client` here would give you a login screen that posts to a
  # domain you do not own.
  client:
    image: ghcr.io/trebeljahr/tracktime-client-selfhost:${TRACKTIME_VERSION:-v0.1.0}
    # Built locally when the tag is not present, exactly like `server` above.
    # The empty API URL is the whole point of this image — see the Dockerfile.
    build:
      context: .
      dockerfile: packages/client/Dockerfile.selfhost
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Database ───────────────────────────────────────────────────────────
  #
  # No authentication configured, and no published port: the only thing that
  # can reach it is a container on this compose network. Enabling auth here
  # would mean a password that has to stay in sync with MONGODB_URI for no
  # gain over that. If you would rather run a managed database, set
  # MONGODB_URI (with its own credentials) and drop this service.
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Cache ──────────────────────────────────────────────────────────────
  #
  # Present because the server connects to it when REDIS_URL is set, not
  # because anything depends on it yet: sessions live in Mongo, and live sync
  # fans out in-process. Appendonly persistence so the named volume below
  # actually means something. Unset REDIS_URL and drop this service if you
  # want the smallest possible stack — drop the depends_on entry above with it.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  caddy-data:
  caddy-config:
  mongo-data:
  mongo-config:
  redis-data:
